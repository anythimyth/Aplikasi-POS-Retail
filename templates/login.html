{% extends "base.html" %}

{% block title %}Masuk ke Sistem - {{ store_name }}{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white mx-auto shadow-xl shadow-brand-500/20 mb-4">
            <i class="fa-solid fa-cash-register text-3xl"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">{{ store_name }}</h2>
        <p class="mt-1 text-sm text-slate-500">Sistem Kasir (Point of Sale) & Manajemen Inventoris Retail</p>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/60 rounded-3xl border border-slate-100 sm:px-10">
            <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input type="text" id="username" name="username" required autocomplete="username"
                               placeholder="admin / kasir"
                               class="block w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Kata Sandi</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                               placeholder="••••••••"
                               class="block w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        <span>Masuk ke Akun</span>
                    </button>
                </div>
            </form>

            <!-- Quick Demo Credentials Selector -->
            <div class="mt-8 pt-6 border-t border-slate-100">
                <p class="text-xs font-medium text-slate-400 text-center mb-3">Akun Demo Cepat (Klik untuk Mengisi):</p>
                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button" onclick="fillCredentials('admin', 'admin123')"
                            class="flex flex-col items-center justify-center p-3 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition-all text-left group">
                        <div class="flex items-center gap-1.5 font-bold text-xs text-slate-700 group-hover:text-brand-700">
                            <i class="fa-solid fa-shield-halved text-brand-600"></i>
                            <span>Admin Toko</span>
                        </div>
                        <span class="text-[11px] text-slate-400 mt-0.5">admin / admin123</span>
                    </button>

                    <button type="button" onclick="fillCredentials('kasir', 'kasir123')"
                            class="flex flex-col items-center justify-center p-3 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition-all text-left group">
                        <div class="flex items-center gap-1.5 font-bold text-xs text-slate-700 group-hover:text-brand-700">
                            <i class="fa-solid fa-user-tag text-blue-600"></i>
                            <span>Kasir POS</span>
                        </div>
                        <span class="text-[11px] text-slate-400 mt-0.5">kasir / kasir123</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCredentials(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }
</script>
{% endblock %}
